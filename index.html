<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=jeopardy-game.html">
    <title>Safe Food Everywhere Jeopardy</title>
    <link rel="icon" href="assets/generated/coca-cola-logo.svg" type="image/svg+xml">
    <style>
      :root {
        --coke-red: #f40000;
        --black: #080000;
        --gold: #ffd15c;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(120deg, rgba(0, 0, 0, 0.94), rgba(87, 0, 0, 0.82)),
          url("assets/generated/digital-screen.png") center / cover;
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        padding: 28px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      }

      img {
        width: min(190px, 60vw);
        filter: brightness(0) invert(1);
      }

      p {
        color: rgba(255, 255, 255, 0.82);
        font-weight: 800;
        line-height: 1.45;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 16px;
        color: var(--white);
        font-weight: 900;
        text-decoration: none;
      }

      .primary {
        background: var(--coke-red);
      }

      .secondary {
        margin-left: 8px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/generated/coca-cola-logo.svg" alt="Coca-Cola">
      <h1>Safe Food Everywhere Jeopardy</h1>
      <p>Launching the World Food Safety Day 2026 game.</p>
      <a class="primary" href="jeopardy-game.html">Open Game</a>
      <a class="secondary" href="campaign-generator.html">Campaign Generator</a>
    </main>
    <script>
      window.location.replace("jeopardy-game.html");
    </script>
  </body>
</html>
