<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Myth or Fact: Beverage Edition</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="quiz-body">
    <main class="quiz-shell">
      <header class="quiz-header">
        <div class="brand-lockup">
          <span class="brand-script">Coca-Cola</span>
          <span class="brand-meta">QSE Passport Fair</span>
        </div>
        <p class="eyebrow">World Food Safety Day</p>
        <h1>Myth or Fact: Beverage Edition</h1>
        <p>Answer six quick questions. Four correct answers earns the Station 3 stamp.</p>
      </header>
      <section class="quiz-panel" aria-live="polite">
        <p class="score" id="progress">Question 1 of 6</p>
        <p class="question" id="questionText"></p>
        <div class="choice-row">
          <button class="choice" type="button" data-answer="Myth">Myth</button>
          <button class="choice" type="button" data-answer="Fact">Fact</button>
        </div>
        <div class="feedback" id="feedback">Choose Myth or Fact to begin.</div>
        <div class="quiz-footer">
          <button class="small-button" type="button" id="nextButton">Next</button>
          <span id="stampStatus">Stamp goal: 4 correct answers</span>
        </div>
      </section>
    </main>
    <script>
      const questions = [
        {
          text: "If equipment looks clean, it is always ready for product contact.",
          answer: "Myth",
          explanation: "Visual checks matter, but sanitation records, approved procedures, and verification are what confirm readiness."
        },
        {
          text: "Damaged packaging should be reported because it can affect product quality, safety, or consumer trust.",
          answer: "Fact",
          explanation: "Damaged packaging can signal contamination, leakage, tampering, or handling issues. Raise it through the site process."
        },
        {
          text: "An ingredient that is past its approved use window can still be used if it smells normal.",
          answer: "Myth",
          explanation: "Use status is based on specifications, approved dates, and site controls, not smell."
        },
        {
          text: "Allergen information matters for beverages, shared food events, and supplier documentation.",
          answer: "Fact",
          explanation: "Allergen controls protect consumers and associates and rely on accurate labels, records, and communication."
        },
        {
          text: "Foreign material concerns should be reported even when the issue seems small.",
          answer: "Fact",
          explanation: "Small observations can prevent bigger issues. Reporting helps the site investigate and control risk."
        },
        {
          text: "Near misses do not need to be shared if no product was affected.",
          answer: "Myth",
          explanation: "Near misses are valuable signals. They help teams improve controls before a product, process, or consumer is affected."
        }
      ];

      let index = 0;
      let score = 0;
      let answered = false;

      const questionText = document.getElementById("questionText");
      const progress = document.getElementById("progress");
      const feedback = document.getElementById("feedback");
      const nextButton = document.getElementById("nextButton");
      const stampStatus = document.getElementById("stampStatus");
      const choices = Array.from(document.querySelectorAll(".choice"));

      function renderQuestion() {
        const current = questions[index];
        answered = false;
        questionText.textContent = current.text;
        progress.textContent = `Question ${index + 1} of ${questions.length}`;
        feedback.textContent = "Choose Myth or Fact.";
        nextButton.textContent = index === questions.length - 1 ? "Finish" : "Next";
        choices.forEach((button) => {
          button.disabled = false;
          button.style.background = "";
          button.style.color = "";
        });
      }

      function finishQuiz() {
        const passed = score >= 4;
        progress.textContent = "Quiz complete";
        questionText.textContent = passed
          ? "Stamp earned: Myth or Fact: Beverage Edition"
          : "Review with the station host and try again for the stamp.";
        feedback.textContent = `Final score: ${score} of ${questions.length}. ${passed ? "Ask the station host for your passport stamp." : "The goal is 4 correct answers."}`;
        stampStatus.textContent = passed ? "Stamp earned" : "Stamp not yet earned";
        choices.forEach((button) => {
          button.disabled = true;
          button.style.background = "";
          button.style.color = "";
        });
        nextButton.textContent = "Restart";
      }

      choices.forEach((button) => {
        button.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          const current = questions[index];
          const isCorrect = button.dataset.answer === current.answer;
          if (isCorrect) score += 1;
          button.style.background = isCorrect ? "#0f7b55" : "#a60000";
          button.style.color = "#ffffff";
          feedback.textContent = `${isCorrect ? "Correct." : "Not quite."} ${current.explanation}`;
          stampStatus.textContent = `Score: ${score} of ${questions.length}`;
          choices.forEach((choice) => choice.disabled = true);
        });
      });

      nextButton.addEventListener("click", () => {
        if (nextButton.textContent === "Restart") {
          index = 0;
          score = 0;
          renderQuestion();
          stampStatus.textContent = "Stamp goal: 4 correct answers";
          return;
        }
        if (index === questions.length - 1) {
          finishQuiz();
          return;
        }
        index += 1;
        renderQuestion();
      });

      renderQuestion();
    </script>
  </body>
</html>
