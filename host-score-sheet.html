<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Safety Face-Off Host Score Sheet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="score-sheet-page">
    <main class="score-sheet">
      <header class="score-sheet-header">
        <div>
          <p class="eyebrow">World Food Safety Day 2026</p>
          <h1>Host Score Sheet</h1>
          <p>Use this page for printed backup scoring, wagers, and host notes.</p>
        </div>
        <button class="primary-button no-print" type="button" id="printScoreSheetButton">Print Score Sheet</button>
      </header>

      <section class="score-sheet-section">
        <h2>Teams</h2>
        <div class="score-team-grid" id="scoreTeamGrid"></div>
      </section>

      <section class="score-sheet-section">
        <h2>Board Tracker</h2>
        <table class="score-board-table" id="scoreBoardTable"></table>
      </section>

      <section class="score-sheet-section final-score-sheet">
        <h2>Final Jeopardy</h2>
        <div class="final-score-grid" id="finalScoreGrid"></div>
      </section>

      <section class="score-sheet-section">
        <h2>Host Notes</h2>
        <div class="score-note-grid">
          <article><span>Signals</span><p></p></article>
          <article><span>Steals / disputes</span><p></p></article>
          <article><span>Debrief commitments</span><p></p></article>
        </div>
      </section>
    </main>

    <script src="jeopardy-data.js"></script>
    <script>
      const stateKey = "wfsd-jeopardy-game-state-v1";
      const minTeamCount = 2;
      const maxTeamCount = 5;
      const maxTeamNameLength = 24;
      const scoreLimit = 999999;
      const data = window.JeopardyData;
      const saved = (() => {
        try {
          const parsed = JSON.parse(localStorage.getItem(stateKey) || "null");
          return parsed?.version === 1 ? parsed : null;
        } catch (error) {
          return null;
        }
      })();

      function clampNumber(value, min, max, fallback = 0) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, Math.trunc(number)));
      }

      function normalizeTeamName(name, index) {
        const value = typeof name === "string" ? name.trim() : "";
        return (value || `Team ${index + 1}`).slice(0, maxTeamNameLength);
      }

      function finalDeltaForResult(result, wager) {
        const safeWager = clampNumber(wager, 0, scoreLimit);
        if (result === "correct") return safeWager;
        if (result === "partial") return Math.floor(safeWager / 2);
        if (result === "incorrect") return -safeWager;
        return 0;
      }

      function validClueIds() {
        const ids = new Set();
        data.categories.forEach((category, categoryIndex) => {
          category.clues.forEach((clue, clueIndex) => {
            ids.add(clueId(categoryIndex, clueIndex));
          });
        });
        return ids;
      }

      function sanitizeTeams(teams) {
        const sourceTeams = Array.isArray(teams) && teams.length ? teams : [
          { name: "Team 1", score: 0 },
          { name: "Team 2", score: 0 },
          { name: "Team 3", score: 0 }
        ];
        const boundedTeams = sourceTeams.slice(0, maxTeamCount).map((team, index) => ({
          name: normalizeTeamName(team?.name, index),
          score: clampNumber(team?.score, -scoreLimit, scoreLimit)
        }));
        while (boundedTeams.length < minTeamCount) {
          boundedTeams.push({ name: `Team ${boundedTeams.length + 1}`, score: 0 });
        }
        return boundedTeams;
      }

      function sanitizeFinalResult(result, wager) {
        const validResults = new Set(["correct", "partial", "incorrect", "none"]);
        if (!result || !validResults.has(result.result)) return { result: "none", label: "", delta: 0 };
        if (result.result === "correct") return { result: "correct", label: "Full", delta: finalDeltaForResult("correct", wager) };
        if (result.result === "partial") return { result: "partial", label: "Half", delta: finalDeltaForResult("partial", wager) };
        if (result.result === "incorrect") return { result: "incorrect", label: "Miss", delta: finalDeltaForResult("incorrect", wager) };
        return { result: "none", label: result.label === "Auto-reviewed" ? "Auto-reviewed" : "", delta: 0 };
      }

      function getRawFinalWager(finalWagers, index) {
        return Array.isArray(finalWagers) ? clampNumber(finalWagers[index], 0, scoreLimit) : 0;
      }

      function deriveFinalStartingScores(savedState, teams, rawFinalWagers, rawFinalResults) {
        const finalLocked = Boolean(savedState?.finalWagersLocked || savedState?.finalResponseRevealed);
        if (!finalLocked) return [];
        if (Array.isArray(savedState?.finalStartingScores)) {
          return teams.map((team, index) => clampNumber(
            savedState.finalStartingScores[index],
            0,
            scoreLimit,
            Math.max(0, team.score)
          ));
        }
        return teams.map((team, index) => {
          const rawWager = getRawFinalWager(rawFinalWagers, index);
          const result = sanitizeFinalResult(rawFinalResults?.[index], rawWager);
          const startingScore = team.score - finalDeltaForResult(result.result, rawWager);
          if (!Number.isFinite(startingScore) || startingScore < 0 || startingScore > scoreLimit) {
            return Math.max(0, team.score);
          }
          return clampNumber(startingScore, 0, scoreLimit, Math.max(0, team.score));
        });
      }

      const teams = sanitizeTeams(saved?.teams);
      const validIds = validClueIds();
      const usedClues = new Set((Array.isArray(saved?.usedClues) ? saved.usedClues : []).filter((id) => validIds.has(id)));
      const finalResponseRevealed = Boolean(saved?.finalResponseRevealed);
      const finalLocked = Boolean(saved?.finalWagersLocked || finalResponseRevealed);
      const rawFinalWagers = Array.isArray(saved?.finalWagers) ? saved.finalWagers.slice(0, teams.length) : [];
      const rawFinalResults = Array.isArray(saved?.finalResults) ? saved.finalResults.slice(0, teams.length) : [];
      const finalStartingScores = deriveFinalStartingScores(saved, teams, rawFinalWagers, rawFinalResults);
      const finalWagers = Array.from({ length: teams.length }, (_, index) => {
        const maxWager = finalLocked
          ? clampNumber(finalStartingScores[index], 0, scoreLimit, Math.max(0, teams[index].score))
          : Math.max(0, teams[index].score);
        return clampNumber(rawFinalWagers[index], 0, maxWager);
      });
      const finalResults = Array.from({ length: teams.length }, (_, index) => sanitizeFinalResult(saved?.finalResults?.[index], finalWagers[index]));
      const finalScoredTeams = new Set((Array.isArray(saved?.finalScoredTeams) ? saved.finalScoredTeams : [])
        .map((index) => Number(index))
        .filter((index) => Number.isInteger(index) && index >= 0 && index < teams.length));
      if (finalResponseRevealed) {
        finalWagers.forEach((wager, index) => {
          if (wager === 0) {
            finalScoredTeams.add(index);
            finalResults[index] = { result: "none", label: "Auto-reviewed", delta: 0 };
          }
        });
      }

      function clueId(categoryIndex, clueIndex) {
        return `${categoryIndex}-${clueIndex}`;
      }

      function formatScore(score) {
        const value = Number(score) || 0;
        return value < 0 ? `-$${Math.abs(value)}` : `$${value}`;
      }

      function formatDelta(delta) {
        const value = Number(delta) || 0;
        return value > 0 ? `+${value}` : `${value}`;
      }

      function formatFinalResult(result, teamIndex) {
        if (result?.label) {
          const delta = Number(result.delta) || 0;
          return delta ? `${result.label} ${formatDelta(delta)}` : result.label;
        }
        if (finalScoredTeams.has(teamIndex)) return "Reviewed";
        return "";
      }

      const teamGrid = document.getElementById("scoreTeamGrid");
      teams.forEach((team) => {
        const card = document.createElement("article");
        const name = document.createElement("strong");
        name.textContent = team.name;
        const score = document.createElement("p");
        score.textContent = `Score: ${formatScore(team.score)}`;
        card.append(name, score);
        teamGrid.appendChild(card);
      });

      const table = document.getElementById("scoreBoardTable");
      const headRow = document.createElement("tr");
      data.categories.forEach((category) => {
        const th = document.createElement("th");
        th.textContent = category.shortName;
        headRow.appendChild(th);
      });
      const thead = document.createElement("thead");
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (let row = 0; row < 5; row += 1) {
        const tr = document.createElement("tr");
        data.categories.forEach((category, categoryIndex) => {
          const td = document.createElement("td");
          const id = clueId(categoryIndex, row);
          const isUsed = usedClues.has(id);
          td.textContent = category.clues[row]?.value || "";
          td.className = isUsed ? "used-clue" : "";
          if (isUsed) {
            const status = document.createElement("span");
            status.textContent = "Used";
            td.appendChild(status);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);

      const finalGrid = document.getElementById("finalScoreGrid");
      teams.forEach((team, index) => {
        const card = document.createElement("article");
        const name = document.createElement("strong");
        name.textContent = team.name;
        card.append(name, document.createElement("p"), document.createElement("p"));
        card.children[1].textContent = `Wager: ${formatScore(finalWagers[index])}`;
        card.children[2].textContent = `Result: ${formatFinalResult(finalResults[index], index)}`;
        finalGrid.appendChild(card);
      });

      document.getElementById("printScoreSheetButton").addEventListener("click", () => window.print());
    </script>
  </body>
</html>
